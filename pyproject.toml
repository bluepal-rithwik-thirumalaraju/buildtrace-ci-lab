[build-system]
requires = ["setuptools==75.8.2", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "buildtrace-invoice-lab"
version = "0.1.0"
description = "A small invoice application for reproducible CI debugging experiments."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["pydantic>=1.10,<2"]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9", "build>=1.2,<2"]

[project.scripts]
invoice-lab = "invoice_lab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
